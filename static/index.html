<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rateverything</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Decorative backdrop: cartoon Los Angeles at sunset (Hollywood sign, downtown,
       Griffith Observatory, palm trees and a Walk of Fame sidewalk). -->
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2c2380"/>
          <stop offset=".34" stop-color="#6a3fc8"/>
          <stop offset=".58" stop-color="#e45f9e"/>
          <stop offset=".72" stop-color="#ff9a5a"/>
          <stop offset="1" stop-color="#ffcf6b"/>
        </linearGradient>
        <radialGradient id="sunFill" cx=".5" cy=".4" r=".6">
          <stop offset="0" stop-color="#fff4b8"/>
          <stop offset="1" stop-color="#ffbe47"/>
        </radialGradient>
        <!-- Retro sunset stripes cut through the lower half of the sun -->
        <mask id="sunStripes">
          <rect x="720" y="110" width="280" height="280" fill="#fff"/>
          <rect x="720" y="284" width="280" height="6" fill="#000"/>
          <rect x="720" y="303" width="280" height="9" fill="#000"/>
          <rect x="720" y="325" width="280" height="12" fill="#000"/>
          <rect x="720" y="350" width="280" height="15" fill="#000"/>
        </mask>
        <pattern id="windows" width="18" height="24" patternUnits="userSpaceOnUse">
          <rect x="5" y="7" width="7" height="10" rx="2" fill="#ffd36b" opacity=".9"/>
        </pattern>
        <symbol id="palm" viewBox="0 0 220 440">
          <path d="M108 435C96 320 128 190 112 70" fill="none" stroke="#16112b" stroke-width="24" stroke-linecap="round"/>
          <path d="M108 435C96 320 128 190 112 70" fill="none" stroke="#7c4a98" stroke-width="14" stroke-linecap="round"/>
          <path d="M102 380h16M100 320h18M104 260h18M110 200h16M112 140h14" stroke="#16112b" stroke-width="4" stroke-linecap="round"/>
          <g transform="translate(112 70)" fill="#33c58e" stroke="#16112b" stroke-width="5" stroke-linejoin="round">
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="rotate(-38)"/>
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="rotate(4)"/>
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="rotate(40)"/>
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="scale(-1 1) rotate(-38)"/>
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="scale(-1 1) rotate(4)"/>
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="scale(-1 1) rotate(40)"/>
            <path d="M0 0C35-28 85-22 112 18C78 2 38 4 0 0Z" transform="rotate(-82)"/>
            <circle cx="-8" cy="10" r="9" fill="#8a4b2a"/><circle cx="9" cy="12" r="9" fill="#8a4b2a"/>
          </g>
        </symbol>
        <symbol id="walkStar" viewBox="-12 -12 24 24">
          <path d="M0-10 2.9-3.1 10-3.1 4.3 1.2 6.4 8.5 0 4.2-6.4 8.5-4.3 1.2-10-3.1-2.9-3.1Z" fill="#ff6f91" stroke="#ffd36b" stroke-width="1.8" stroke-linejoin="round"/>
        </symbol>
      </defs>

      <!-- Layers carry a parallax depth (0 = sky, 1 = nearest); shapes reach past
           the 1600px frame so the edges never show while they move. -->
      <rect x="-200" width="2000" height="900" fill="url(#sky)"/>
      <g class="layer twinkle" data-depth=".05" fill="#fff" opacity=".7">
        <circle cx="120" cy="70" r="2.5"/><circle cx="310" cy="130" r="2"/><circle cx="520" cy="60" r="3"/>
        <circle cx="760" cy="110" r="2"/><circle cx="980" cy="50" r="2.5"/><circle cx="1240" cy="90" r="2"/>
        <circle cx="1450" cy="40" r="3"/><circle cx="1540" cy="150" r="2"/><circle cx="660" cy="180" r="1.8"/>
      </g>

      <g class="layer" data-depth=".1">
        <circle class="sun-glow" cx="860" cy="250" r="175" fill="#ffd36b" opacity=".18"/>
        <circle cx="860" cy="250" r="120" fill="url(#sunFill)" mask="url(#sunStripes)"/>
      </g>

      <g class="layer" data-depth=".22">
      <g class="cloud" fill="#ffe3f1" opacity=".85">
        <rect x="140" y="170" width="190" height="40" rx="20"/><circle cx="200" cy="168" r="34"/><circle cx="250" cy="174" r="24"/>
      </g>
      <g class="cloud c2" fill="#ffe3f1" opacity=".7">
        <rect x="1250" y="150" width="230" height="44" rx="22"/><circle cx="1320" cy="146" r="38"/><circle cx="1380" cy="154" r="26"/>
      </g>
      <g class="cloud c3" fill="#ffd9ea" opacity=".6">
        <rect x="990" y="110" width="150" height="32" rx="16"/><circle cx="1040" cy="108" r="26"/>
      </g>
      </g>

      <!-- San Gabriel mountains, far away -->
      <path class="layer" data-depth=".25" d="M-160 560L0 520C150 430 260 470 380 420S620 380 760 440 1000 400 1150 430 1400 370 1600 440L1760 480V900H-160Z" fill="#9c66d6"/>
      <!-- Hollywood hills with the sign, Griffith Observatory on the shoulder -->
      <g class="layer" data-depth=".4">
      <path d="M700 700C850 420 1000 300 1180 285S1480 300 1600 360L1760 400V900H700Z" fill="#6d3dbd" stroke="#16112b" stroke-width="6" stroke-linejoin="round"/>
      <g font-family="Fredoka, sans-serif" font-weight="700" font-size="52" fill="#fff" stroke="#16112b" stroke-width="5" paint-order="stroke" text-anchor="middle">
        <text x="1064" y="336">H</text><text x="1110" y="328">O</text><text x="1152" y="323">L</text>
        <text x="1188" y="320">L</text><text x="1228" y="319">Y</text><text x="1278" y="319">W</text>
        <text x="1328" y="321">O</text><text x="1374" y="325">O</text><text x="1420" y="330">D</text>
      </g>
      <g stroke="#16112b" stroke-width="4" stroke-linejoin="round" fill="#efe9ff">
        <rect x="862" y="404" width="92" height="24" rx="4"/>
        <path d="M887 404a21 21 0 0 1 42 0Z"/>
        <path d="M864 404a9 9 0 0 1 18 0Z"/><path d="M934 404a9 9 0 0 1 18 0Z"/>
      </g>
      </g>

      <!-- Downtown skyline -->
      <g class="layer" data-depth=".55" stroke="#16112b" stroke-width="5" stroke-linejoin="round">
        <rect x="1120" y="610" width="58" height="140" rx="6" fill="#33246a"/><rect x="1126" y="616" width="46" height="128" fill="url(#windows)" stroke="none"/>
        <rect x="1185" y="560" width="70" height="190" rx="6" fill="#2b1f5e"/><rect x="1191" y="566" width="58" height="178" fill="url(#windows)" stroke="none"/>
        <rect x="1262" y="468" width="82" height="282" rx="14" fill="#33246a"/><rect x="1270" y="480" width="66" height="264" fill="url(#windows)" stroke="none"/>
        <rect x="1274" y="446" width="58" height="26" rx="9" fill="#ff9a5a"/>
        <rect x="1352" y="530" width="62" height="220" rx="6" fill="#2b1f5e"/><rect x="1358" y="536" width="50" height="208" fill="url(#windows)" stroke="none"/>
        <path d="M1424 750V522Q1452 470 1494 452V750Z" fill="#3a2a78"/><path d="M1432 750V530Q1455 490 1486 474V750Z" fill="url(#windows)" stroke="none"/>
        <path d="M1494 452V404" fill="none"/>
        <rect x="1502" y="600" width="72" height="150" rx="6" fill="#2b1f5e"/><rect x="1508" y="606" width="60" height="138" fill="url(#windows)" stroke="none"/>
      </g>

      <g class="layer" data-depth=".85">
      <!-- Near ground -->
      <path d="M-160 724L0 720C260 690 520 708 800 700S1340 690 1600 712L1760 716V1000H-160Z" fill="#4a2a8f" stroke="#16112b" stroke-width="6"/>

      <!-- Palm trees -->
      <use class="palm" href="#palm" x="-20" y="360" width="230" height="460"/>
      <use class="palm" href="#palm" x="250" y="430" width="180" height="370"/>
      <use class="palm" href="#palm" x="1180" y="440" width="170" height="350"/>
      <use class="palm" href="#palm" x="1440" y="350" width="230" height="460"/>

      <!-- Walk of Fame sidewalk and the street -->
      <rect x="-170" y="790" width="1940" height="50" fill="#ff9d86" stroke="#16112b" stroke-width="6"/>
      <g>
        <use href="#walkStar" x="-130" y="800" width="30" height="30"/><use href="#walkStar" x="1670" y="800" width="30" height="30"/>
        <use href="#walkStar" x="70" y="800" width="30" height="30"/><use href="#walkStar" x="270" y="800" width="30" height="30"/>
        <use href="#walkStar" x="470" y="800" width="30" height="30"/><use href="#walkStar" x="670" y="800" width="30" height="30"/>
        <use href="#walkStar" x="870" y="800" width="30" height="30"/><use href="#walkStar" x="1070" y="800" width="30" height="30"/>
        <use href="#walkStar" x="1270" y="800" width="30" height="30"/><use href="#walkStar" x="1470" y="800" width="30" height="30"/>
      </g>
      <rect x="-170" y="840" width="1940" height="160" fill="#2a2150"/>
      <path d="M-160 872H1760" stroke="#ffd36b" stroke-width="7" stroke-dasharray="46 34"/>
      </g>
    </svg>
  </div>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="Rateverything — início"><span>rate</span><span>everything</span></a>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <script src="/app.js"></script>
</body>
</html>
